<meta charset="utf-8">
<style>
@font-face { font-family: ms; src: url("../assets/site/fonts/ms_sans_serif.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 880px; background: transparent; }
.grid { display: flex; flex-wrap: wrap; width: 880px; }
.tile {
  width: 88px; height: 84px; flex: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
}
.card {
  width: 76px; height: 76px;
  background: #FFFBEA;
  border: 1px solid #b9b09a;
  box-shadow: 2px 2px 0 rgba(0,0,0,.28);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.card img { width: 34px; height: 34px; display: block; }
.card span {
  font-family: ms, sans-serif; font-size: 11px; color: #000;
  background: #FFFF00; padding: 2px 3px 0; line-height: 12px;
  white-space: nowrap; max-width: 72px; overflow: hidden;
}
</style>
<div class="grid" id="g"></div>
<script>
const rows = [
  ["javascript","javascript"],["typescript","typescript"],["react","react"],["nextjs","next.js"],
  ["vuejs","vue"],["nuxtjs","nuxt"],["flutter","flutter"],["sass","sass"],
  ["tailwind","tailwind"],["figma","figma"],
  ["python","python"],["nodejs","node.js"],["postgresql","postgres"],["graphql","graphql"],
  ["docker","docker"],["firebase","firebase"],["cypress","cypress"],["git","git"],["linux","linux"]
];
document.getElementById('g').innerHTML = rows.map(([f,l]) =>
  `<div class="tile"><div class="card"><img src="../assets/stack/${f}.svg" alt=""><span>${l}</span></div></div>`
).join('');
</script>
